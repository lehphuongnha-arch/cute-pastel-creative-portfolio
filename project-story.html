<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project story — Nha Le</title><style>
:root{--pink:#f7bcb0;--rose:#c85555;--blue:#aadcf2;--cream:#fff9f4;--ink:#493c50;--muted:#76697b}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;background:radial-gradient(ellipse at top left,#f7bcb055,transparent 45%),radial-gradient(ellipse at bottom right,#aadcf244,transparent 48%),var(--cream);line-height:1.55}
a{color:inherit}.page{width:min(1030px,94%);margin:28px auto 60px;padding:clamp(16px,4vw,45px);background:#fffaf3;box-shadow:0 14px 50px #815e6928;position:relative;border:1px solid #f2ddd5;overflow:hidden}.page:before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#aadcf21c 1px,transparent 1px),linear-gradient(90deg,#aadcf21c 1px,transparent 1px);background-size:22px 22px;opacity:.5}
.page>*{position:relative}.back{display:inline-block;text-decoration:none;font-size:.9rem;font-weight:800;color:var(--rose);margin-bottom:22px}.hero{display:grid;grid-template-columns:1fr .85fr;gap:30px;align-items:center;min-height:270px}.eyebrow{font-size:.78rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--rose)}h1{font-size:clamp(2.7rem,6vw,5.5rem);line-height:1.02;letter-spacing:-.055em;color:#784650;margin:12px 0}h2{font-size:1.13rem;color:#914a61;margin:0 0 12px}h3{color:#914a61;margin:10px 0 4px;font-size:.98rem}.meta{font-size:.85rem;color:var(--muted)}.cover-stack{position:relative;padding:20px;transform:rotate(3deg)}.cover-stack:before,.cover-stack:after{content:"";position:absolute;inset:22px 20px;background:#aadcf2aa;transform:rotate(-8deg);box-shadow:0 8px 20px #493c5022}.cover-stack:after{background:#f7bcb0aa;transform:rotate(-3deg)}.cover{position:relative;z-index:1;min-height:260px;max-height:360px;width:100%;object-fit:contain;background:#fffefa;border:12px solid white;box-shadow:0 12px 28px #493c5033}.cover-empty{position:relative;z-index:1;display:grid;place-items:center;min-height:280px;background:linear-gradient(130deg,#e5f5fc,#fff9f4);border:12px solid white;font-size:4rem;color:#b87d99}.doodle{position:absolute;z-index:2;font-size:2rem;pointer-events:none}.star{right:0;top:0}.flower{left:-8px;bottom:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px}.paper{background:#fffefa;border:1px solid #efd9d4;padding:clamp(18px,2.8vw,26px);box-shadow:3px 5px 0 #f7bcb045,0 7px 16px #815e6912;position:relative;min-width:0}.paper:nth-child(2n){transform:rotate(.4deg)}.paper:nth-child(2n+1){transform:rotate(-.4deg)}.paper p{font-size:.91rem;color:var(--muted);margin:0}.paper ul{padding-left:20px;margin:0;color:var(--muted);font-size:.9rem}.wide{grid-column:1/-1}.flower-head:before{content:"✿";color:#db7e9b;margin-right:10px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.step-number{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#df829d;color:white;font-weight:900}.step p{margin-top:6px}.art-gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.art-gallery img{width:100%;height:230px;object-fit:contain;background:#fff9f4;border:8px solid white;box-shadow:0 4px 12px #815e6922}.note{font-size:.84rem;color:var(--muted);font-style:italic}.bottom{display:flex;justify-content:space-between;gap:12px;margin-top:30px;border-top:1px dashed #e7b6c4;padding-top:18px}.bottom a{font-weight:900;text-decoration:none;color:var(--rose)}.washi{position:absolute;width:100px;height:23px;background:#aadcf280;transform:rotate(-14deg);top:-11px;left:32%;opacity:.8}.hide{display:none!important}
@media(max-width:700px){.hero,.grid{grid-template-columns:1fr}.wide{grid-column:auto}.steps{grid-template-columns:1fr}.cover-stack{max-width:420px;margin:auto}.art-gallery{grid-template-columns:1fr}.page{margin:10px auto 30px}.bottom{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

/* Creative notebook case study — editorial scrapbook, same site palette */
body{background:#f8f0e9}
.page{width:min(1120px,95%);background:#fff9f0;padding:clamp(22px,5vw,62px);border:0;border-radius:3px;box-shadow:0 18px 65px #775d5525}
.page:before{background-image:linear-gradient(#aadcf218 1px,transparent 1px);background-size:100% 31px;opacity:.8}
.page:after{content:"✿  ✧  ♡";position:absolute;right:4%;top:16px;color:#c8555575;font-size:24px;letter-spacing:16px;pointer-events:none}
.back{background:#e5f5fc;padding:9px 17px;border-radius:30px;transform:rotate(-2deg)}
.hero{grid-template-columns:1fr 1.1fr;gap:clamp(18px,5vw,68px);min-height:420px;margin:24px 0 48px}
.hero>div:first-child{position:relative;padding:26px 0}
.hero>div:first-child:after{content:"a little story, thoughtfully made ♡";display:block;font-family:"Comic Sans MS","Segoe Print",cursive;font-size:1rem;color:#b67b90;margin-top:30px;transform:rotate(-3deg)}
.eyebrow{font-family:"Comic Sans MS","Segoe Print",cursive;font-size:1rem;letter-spacing:.02em;text-transform:none}
h1{font-size:clamp(2.8rem,6vw,5.8rem);line-height:1.08;color:#493c50;letter-spacing:-.045em}
.hero h2{font-family:"Comic Sans MS","Segoe Print",cursive;font-size:1.3rem;color:#c85555}
.cover-stack{transform:rotate(3deg);padding:24px}
.cover-stack:before{inset:20px 26px;background:#aadcf2a0;transform:rotate(-10deg)}
.cover-stack:after{inset:20px 26px;background:#f7bcb0b0;transform:rotate(-4deg)}
.cover,.cover-empty{border:13px solid white;box-shadow:0 12px 25px #493c5029}
.cover{min-height:310px;max-height:470px}
.cover-stack:focus-within{outline:2px solid #c85555}
.grid{grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(18px,3vw,30px);align-items:start}
.paper{grid-column:span 6;padding:clamp(22px,3vw,32px);border:0;border-radius:2px;background:#fffefb;box-shadow:3px 5px 0 #f7bcb060,0 8px 22px #815e6920;min-height:155px}
.paper:nth-child(4n+2){background:#f3f9fa}
.paper:nth-child(4n+3){background:#fff4f0}
.paper.wide{grid-column:1/-1}
.paper h2{font-family:"Comic Sans MS","Segoe Print",cursive;font-size:clamp(1.18rem,2.5vw,1.65rem);font-weight:700;letter-spacing:-.02em;color:#a54c64;border-bottom:2px dashed #f7bcb0;padding-bottom:10px;margin-bottom:17px}
.paper p{font-size:1rem;line-height:1.85;color:#554e58;white-space:pre-line}
.paper:before{content:"";position:absolute;left:38%;top:-13px;width:94px;height:24px;background:repeating-linear-gradient(90deg,#aadcf299 0 12px,#fff9f499 12px 24px);transform:rotate(-5deg);box-shadow:0 1px 3px #493c5011}
.paper:nth-child(3n):before{background:repeating-linear-gradient(90deg,#f7bcb0a0 0 12px,#fff9f4a0 12px 24px);transform:rotate(6deg)}
.steps{grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.step{padding:16px 15px 20px;background:#fff8f5;border:1px dashed #e8b5c1;transform:rotate(-1deg)}
.step:nth-child(2n){transform:rotate(1deg);background:#f1f8fa}
.step h3{font-family:"Comic Sans MS","Segoe Print",cursive;font-size:1.1rem}
.step-number{background:#f7bcb0;color:#493c50}
.art-gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(20px,3vw,35px);padding:10px}
.art-gallery img{height:auto;min-height:180px;max-height:500px;object-fit:contain;border:12px solid #fff;background:#fff;box-shadow:0 12px 24px #815e6926;transform:rotate(-2deg)}
.art-gallery img:nth-child(2n){transform:rotate(2deg)}
.art-gallery img:nth-child(3n){transform:rotate(1deg)}
.note{margin-top:18px!important}
.bottom{margin-top:50px;padding-top:24px}
.notebook-divider{display:flex;justify-content:center;gap:18px;color:#c85555;font-family:"Comic Sans MS","Segoe Print",cursive;font-size:1.1rem;margin:24px 0 34px}
.notebook-sticker{position:absolute;right:3%;bottom:-15px;font-size:2rem;transform:rotate(15deg);z-index:2;pointer-events:none}
@media(max-width:760px){.hero{grid-template-columns:1fr;gap:10px;margin-bottom:35px}.grid{grid-template-columns:1fr}.paper,.paper.wide{grid-column:1}.steps{grid-template-columns:1fr}.art-gallery{grid-template-columns:1fr}.cover-stack{max-width:480px;margin:auto}.page{width:97%;margin:8px auto 30px}.paper{min-height:0}.hero>div:first-child{padding:8px 0}.bottom{flex-wrap:wrap}}
</style></head><body><main class="page"><a class="back" href="index.html#works">← All Projects</a><section class="hero"><div><div class="eyebrow">✿ A little design story</div><h1 id="title">Project</h1><h2 id="category"></h2><p class="meta" id="meta"></p></div><div class="cover-stack"><span class="doodle star">⭐</span><span class="doodle flower">🌸</span><div id="cover"><div class="cover-empty">✿</div></div><span class="notebook-sticker" aria-hidden="true">🌷</span></div></section><div class="notebook-divider" aria-hidden="true">✿ · notes from my sketchbook · ✿</div><div class="grid"><section class="paper"><span class="washi"></span><h2 class="flower-head">About the Project</h2><p id="description"></p></section><section class="paper"><h2 class="flower-head">What I Did</h2><p id="what"></p></section><section class="paper"><h2 class="flower-head">Objective</h2><p id="objective"></p></section><section class="paper"><h2 class="flower-head">Challenge</h2><p id="challenge"></p></section><section class="paper wide" id="processSection"><h2 class="flower-head">Design Process</h2><div class="steps" id="steps"></div></section><section class="paper wide"><h2 class="flower-head">Final Design & Mockups</h2><div class="art-gallery" id="gallery"></div><p class="note" id="galleryNote"></p></section></div><nav class="bottom"><a href="index.html#works">← Featured Projects</a><a href="works.html">Explore more work →</a></nav></main><script>
const escapeHTML=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const params=new URLSearchParams(location.search),requested=params.get("project")||"";
const slug=s=>String(s||"").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
async function run(){try{const r=await fetch("content/portfolio.json",{cache:"no-store"});if(!r.ok)throw Error("Content unavailable");const d=await r.json();const projects=(d.projects||[]).filter(p=>p.published===true);const p=projects.find(p=>slug(p.title)===requested);if(!p){document.getElementById("title").textContent="Project not found";return;}
document.title=p.title+" — Nha Le";document.getElementById("title").textContent=p.title;document.getElementById("category").textContent=p.category||"";document.getElementById("meta").textContent=[p.year,p.category,p.tools].filter(Boolean).join(" · ");document.getElementById("description").textContent=p.description||"";
const detail=p.caseStudy||{};for(const [id,key] of [["what","whatIDid"],["objective","objective"],["challenge","challenge"]]){const el=document.getElementById(id);el.textContent=detail[key]||"Details coming soon.";if(!detail[key])el.parentElement.classList.add("hide");}
const process=Array.isArray(detail.process)?detail.process:[];if(process.length){document.getElementById("steps").innerHTML=process.map((v,i)=>'<div class="step"><span class="step-number">'+(i+1)+'</span><h3>'+escapeHTML(v.title||"Step "+(i+1))+'</h3><p>'+escapeHTML(v.description||"")+'</p></div>').join("");}else document.getElementById("processSection").classList.add("hide");
if(p.image){document.getElementById("cover").innerHTML='<img class="cover" src="'+escapeHTML(p.image)+'" alt="'+escapeHTML(p.title)+' project artwork">';}
const gallery=[p.image,...(Array.isArray(p.gallery)?p.gallery:[])].filter(Boolean);document.getElementById("gallery").innerHTML=gallery.map((url,i)=>'<img src="'+escapeHTML(url)+'" alt="'+escapeHTML(p.title)+' artwork '+(i+1)+'" loading="lazy">').join("");document.getElementById("galleryNote").textContent=gallery.length?"":"Project images will appear here when added in the CMS.";
}catch(e){document.getElementById("title").textContent="Project details unavailable";}}
run();
</script></body></html>
