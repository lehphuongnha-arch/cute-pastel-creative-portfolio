</style></head><body><div class="journal-site-nav"><a class="journal-site-brand" href="index.html"><img src="assets/logo-original.png" alt="Nha Le logo"></a><button class="journal-mobile-menu-button" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="journal-mobile-links">☰</button><nav id="journal-mobile-links" aria-label="Main navigation"><a href="index.html">Home</a><a href="works.html">Works</a><a href="about.html">About Me</a><a href="index.html#faq">FAQ</a><a href="resume.html">Resume</a><a href="contact.html">Contact</a></nav><div class="journal-site-actions"><button type="button" id="journalThemeToggle" class="journal-theme-toggle" aria-label="Switch to dark mode" aria-pressed="false" title="Toggle theme">☾</button><a class="journal-site-hello" href="contact.html">Say Hello ♡</a></div></div><main class="page" style="position:relative"><div class="scrapbook-stickers" aria-hidden="true"><img src="assets/stickers/flower-paperclip.png" alt="" onerror="this.hidden=true"><img src="assets/stickers/stationery-clips.png" alt="" onerror="this.hidden=true"><img src="assets/stickers/kraft-notebook.png" alt="" onerror="this.hidden=true"><img src="assets/stickers/stacked-books.png" alt="" onerror="this.hidden=true"><img src="assets/stickers/open-journal.png" alt="" onerror="this.hidden=true"></div><section class="hero"><div><div class="eyebrow">✿ A little design story</div><h1 id="title">Project</h1><h2 id="category"></h2><p class="meta" id="meta"></p></div><div class="cover-stack"><span class="journal-tape" aria-hidden="true"></span><span class="cute-tape tape-check" aria-hidden="true"></span><div id="cover"><div class="cover-empty">✿</div></div></div></section><div class="notebook-divider" aria-hidden="true">✿ · notes from my sketchbook · ✿</div><div class="grid"><section class="paper"><span class="washi"></span><h2 class="flower-head">About the Project</h2><p id="description"></p></section><section class="paper"><h2 class="flower-head">What I Did</h2><p id="what"></p></section><section class="paper"><h2 class="flower-head">Objective</h2><p id="objective"></p></section><section class="paper"><h2 class="flower-head">Challenge</h2><p id="challenge"></p></section><section class="paper wide" id="processSection"><h2 class="flower-head">Design Process</h2><div class="steps" id="steps"></div></section><section class="paper wide"><h2 class="flower-head">Final Design & Mockups</h2><div class="art-gallery" id="gallery"></div><p class="note" id="galleryNote"></p></section></div><nav class="bottom journal-nav"><a data-go-back href="works.html">← Back</a><a href="works.html">Explore More →</a></nav></main><script>
const escapeHTML=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const params=new URLSearchParams(location.search),requested=params.get("project")||"";
const slug=s=>String(s||"").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
async function run(){try{const r=await fetch("content/portfolio.json",{cache:"no-store"});if(!r.ok)throw Error("Content unavailable");const d=await r.json();const projects=(d.projects||[]).filter(p=>p.published===true);const p=projects.find(p=>slug(p.title)===requested);if(!p){document.getElementById("title").textContent="Project not found";return;}
document.title=p.title+" — Nha Le";document.getElementById("title").textContent=p.title;document.getElementById("category").textContent=p.category||"";document.getElementById("meta").textContent=[p.year,p.category,p.tools].filter(Boolean).join(" · ");document.getElementById("description").textContent=p.description||"";
const detail=p.caseStudy||{};for(const [id,key] of [["what","whatIDid"],["objective","objective"],["challenge","challenge"]]){const el=document.getElementById(id);el.textContent=detail[key]||"Details coming soon.";if(!detail[key])el.parentElement.classList.add("hide");}
const process=Array.isArray(detail.process)?detail.process:[];if(process.length){document.getElementById("steps").innerHTML=process.map((v,i)=>'<div class="step"><span class="step-number">'+(i+1)+'</span><h3>'+escapeHTML(v.title||"Step "+(i+1))+'</h3><p>'+escapeHTML(v.description||"")+'</p></div>').join("");}else document.getElementById("processSection").classList.add("hide");
if(p.image){document.getElementById("cover").innerHTML='<img class="cover" src="'+escapeHTML(p.image)+'" alt="'+escapeHTML(p.title)+' project artwork">';}
const gallery=[p.image,...(Array.isArray(p.gallery)?p.gallery:[])].filter(Boolean);document.getElementById("gallery").innerHTML=gallery.map((url,i)=>'<img src="'+escapeHTML(url)+'" alt="'+escapeHTML(p.title)+' artwork '+(i+1)+'" loading="lazy">').join("");document.getElementById("galleryNote").textContent=gallery.length?"":"Project images will appear here when added in the CMS.";
}catch(e){document.getElementById("title").textContent="Project details unavailable";}}
run();
</script><script>
(function(){const fallback="works.html";function sameSitePrevious(){try{const u=new URL(document.referrer);return u.origin===location.origin&&u.pathname!==location.pathname?u.href:null}catch{return null}}
const previous=sameSitePrevious();document.querySelectorAll("[data-go-back]").forEach(a=>{a.href=previous||fallback;a.addEventListener("click",e=>{if(previous&&history.length>1){e.preventDefault();history.back()}})});
})();
</script><script id="journal-theme-sync">
(function(){const btn=document.getElementById('journalThemeToggle');if(!btn)return;function setTheme(dark){document.body.dataset.dark=dark?'yes':'no';btn.textContent=dark?'☀':'☾';btn.setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');btn.setAttribute('aria-pressed',String(dark));try{localStorage.setItem('nha-theme',dark?'dark':'light')}catch(e){}}let dark=false;try{dark=localStorage.getItem('nha-theme')==='dark'}catch(e){}setTheme(dark);btn.addEventListener('click',()=>setTheme(document.body.dataset.dark!=='yes'));window.addEventListener('storage',e=>{if(e.key==='nha-theme')setTheme(e.newValue==='dark')})})();
</script><script id="journal-mobile-nav-script">
(function(){const bar=document.querySelector('.journal-site-nav');if(!bar)return;const button=bar.querySelector('.journal-mobile-menu-button');const menu=bar.querySelector('nav');if(!button||!menu)return;function close(){bar.classList.remove('is-menu-open');button.setAttribute('aria-expanded','false');button.setAttribute('aria-label','Open navigation menu');button.textContent='☰'}button.addEventListener('click',function(){const open=!bar.classList.contains('is-menu-open');bar.classList.toggle('is-menu-open',open);button.setAttribute('aria-expanded',String(open));button.setAttribute('aria-label',open?'Close navigation menu':'Open navigation menu');button.textContent=open?'×':'☰'});menu.addEventListener('click',e=>{if(e.target.closest('a'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});document.addEventListener('click',e=>{if(!bar.contains(e.target))close()});window.addEventListener('resize',()=>{if(window.innerWidth>760)close()})})();
</script></body></html>
