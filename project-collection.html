(async()=>{try{const r=await fetch("content/portfolio.json",{cache:"no-store"});if(!r.ok)throw Error("Data unavailable");const data=await r.json(),all=(data.projects||[]).filter(p=>p.published===true),selected=all.find(p=>slug(p.title)===new URLSearchParams(location.search).get("project"));if(!selected){document.getElementById("title").textContent="Collection not found";return;}document.title=selected.title+" — Collection";document.getElementById("title").textContent=selected.title;const same=all.filter(p=>p.category===selected.category);const items=Array.isArray(selected.subprojects)&&selected.subprojects.length?selected.subprojects.filter(p=>p.published!==false):same;document.getElementById("intro").textContent="Browse "+(selected.category||"design")+" projects, then open a project to see the full design process and final work.";document.getElementById("grid").innerHTML=items.map(p=>{const isSub=items!==same;const href=isSub?"project-story.html?project="+encodeURIComponent(slug(selected.title))+"&subproject="+encodeURIComponent(slug(p.title)):"project-story.html?project="+encodeURIComponent(slug(p.title));return '<a class="item scrapbook-folder" href="'+href+'" aria-label="Open '+esc(p.title)+' case study"><span class="folder-paper" aria-hidden="true"></span><span class="folder-artwork">'+(p.image?'<img loading="lazy" src="'+esc(p.image)+'" alt="'+esc(p.title)+' artwork">':'<span class="folder-empty" aria-label="Artwork not yet uploaded">✿</span>')+'</span><span class="folder-label">'+esc(p.title)+'</span><span class="folder-clip" aria-hidden="true">📎</span><span class="folder-sticker" aria-hidden="true">🐰</span><span class="folder-spark" aria-hidden="true">✎</span><span class="folder-meta">'+esc(p.year||selected.year||"")+'</span></a>'}).join("");if(items.length===1)document.getElementById("note").textContent="More projects can be added to this collection later."; }catch(e){document.getElementById("title").textContent="Collection unavailable";}})();
</script><script>
(function(){const fallback="works.html";function sameSitePrevious(){try{const u=new URL(document.referrer);return u.origin===location.origin&&u.pathname!==location.pathname?u.href:null}catch{return null}}
const previous=sameSitePrevious();document.querySelectorAll("[data-go-back]").forEach(a=>{a.href=previous||fallback;a.addEventListener("click",e=>{if(previous&&history.length>1){e.preventDefault();history.back()}})});
})();
</script><script id="journal-theme-sync">
(function(){const btn=document.getElementById('journalThemeToggle');if(!btn)return;function setTheme(dark){document.body.dataset.dark=dark?'yes':'no';btn.textContent=dark?'☀':'☾';btn.setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');btn.setAttribute('aria-pressed',String(dark));try{localStorage.setItem('nha-theme',dark?'dark':'light')}catch(e){}}let dark=false;try{dark=localStorage.getItem('nha-theme')==='dark'}catch(e){}setTheme(dark);btn.addEventListener('click',()=>setTheme(document.body.dataset.dark!=='yes'));window.addEventListener('storage',e=>{if(e.key==='nha-theme')setTheme(e.newValue==='dark')})})();
</script><script id="journal-mobile-nav-script">
(function(){const bar=document.querySelector('.journal-site-nav');if(!bar)return;const button=bar.querySelector('.journal-mobile-menu-button');const menu=bar.querySelector('nav');if(!button||!menu)return;function close(){bar.classList.remove('is-menu-open');button.setAttribute('aria-expanded','false');button.setAttribute('aria-label','Open navigation menu');button.textContent='☰'}button.addEventListener('click',function(){const open=!bar.classList.contains('is-menu-open');bar.classList.toggle('is-menu-open',open);button.setAttribute('aria-expanded',String(open));button.setAttribute('aria-label',open?'Close navigation menu':'Open navigation menu');button.textContent=open?'×':'☰'});menu.addEventListener('click',e=>{if(e.target.closest('a'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});document.addEventListener('click',e=>{if(!bar.contains(e.target))close()});window.addEventListener('resize',()=>{if(window.innerWidth>1199)close()})})();
</script></body></html>
