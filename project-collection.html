<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Collection — Nha Le</title>
<style>
:root{--cream:#fff9f4;--pink:#f7bcb0;--blue:#aadcf2;--ink:#493c50;--rose:#c85555}
*{box-sizing:border-box}body{margin:0;background:#fff4ee;color:var(--ink);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif}
main{max-width:1100px;margin:28px auto;padding:clamp(20px,4vw,50px);background:var(--cream);min-height:85vh;box-shadow:0 14px 45px #493c5018;background-image:linear-gradient(#aadcf21c 1px,transparent 1px);background-size:100% 28px}
a{color:inherit}.back{color:var(--rose);font-weight:800;text-decoration:none}header{margin:32px 0 42px;position:relative}header:after{content:"✿  creative collection  ♡";display:block;margin-top:14px;color:var(--rose);font-size:.8rem;letter-spacing:.12em}
h1{font-family:Georgia,serif;font-size:clamp(2.6rem,6vw,5rem);line-height:1.06;margin:12px 0;color:#784650}p{line-height:1.65}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px}.item{display:block;text-decoration:none;transform:rotate(-1.5deg);transition:transform .2s ease}.item:nth-child(even){transform:rotate(1.5deg)}.item:hover,.item:focus-visible{transform:translateY(-7px) rotate(0)}.item:focus-visible{outline:3px solid var(--rose);outline-offset:5px}.photo{aspect-ratio:4/3;display:grid;place-items:center;background:linear-gradient(140deg,#e5f5fc,#fff9f4);border:12px solid white;box-shadow:0 7px 18px #493c5024;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.empty{font-size:3.3rem;color:#b87d99}.name{display:block;margin:14px 6px 4px;font-weight:900;font-size:1.1rem}.meta{margin:0 6px;color:#76697b;font-size:.87rem}.note{margin-top:35px;color:#76697b;font-size:.85rem}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){.grid{grid-template-columns:1fr;max-width:380px;margin:auto}}
@media(prefers-reduced-motion:reduce){.item{transition:none}}
</style><style>
/* Hand-drawn bunny art and patterned washi — decorative, never an icon font */
.journal-bunny{position:absolute;right:9%;top:0;width:84px;height:84px;z-index:4;transform:rotate(12deg);pointer-events:none;filter:drop-shadow(0 5px 4px #493c5020)}
.journal-bunny .bunny-art{display:block;width:100%;height:100%}
.journal-tape{position:absolute;left:29%;top:-12px;width:120px;height:28px;z-index:3;transform:rotate(-9deg);opacity:.9;background:repeating-linear-gradient(90deg,#f7bcb0 0 13px,#fff9f4 13px 23px,#aadcf2 23px 35px);clip-path:polygon(0 0,100% 0,97% 50%,100% 100%,0 100%,3% 50%)}
.journal-nav a{font-weight:900}
@media(max-width:600px){.journal-bunny{width:62px;height:62px;right:5%}.journal-tape{width:85px}}
</style><style>
/* User-provided paper-cut stationery stickers. Images gracefully hide until assets are uploaded. */
.scrapbook-stickers{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:visible}
.scrapbook-stickers img{position:absolute;width:clamp(48px,7vw,92px);height:auto;object-fit:contain;filter:drop-shadow(0 4px 5px #493c501c);opacity:.95}
.scrapbook-stickers img:nth-child(1){top:7%;right:2%;transform:rotate(13deg)}
.scrapbook-stickers img:nth-child(2){top:43%;left:-4%;transform:rotate(-12deg);width:clamp(44px,6vw,75px)}
.scrapbook-stickers img:nth-child(3){bottom:2%;right:5%;transform:rotate(9deg)}
.scrapbook-stickers img:nth-child(4){bottom:13%;left:2%;transform:rotate(-7deg)}
.scrapbook-stickers img:nth-child(5){top:22%;right:-3%;transform:rotate(8deg)}
@media(max-width:650px){.scrapbook-stickers img{width:45px!important;opacity:.8}.scrapbook-stickers img:nth-child(2),.scrapbook-stickers img:nth-child(4){display:none}}
</style><style>.collection-bottom{margin:40px 0 10px;display:flex;justify-content:flex-start}.collection-bottom a{display:inline-flex;align-items:center;justify-content:center;min-width:165px;min-height:70px;padding:15px 28px;background:#f7bcb0;color:#493c50;font-weight:900;text-decoration:none;border:3px solid #b76c7c;border-radius:54% 46% 48% 52% / 52% 49% 51% 48%;box-shadow:4px 7px 0 #e9c7c0;transform:rotate(-3deg)}.collection-bottom a:hover{transform:translateY(-4px) rotate(0deg)}.collection-bottom a:focus-visible{outline:3px solid #c85555;outline-offset:5px}</style><style>
/* Scrapbook collection cards: clipped sheets with playful, unobtrusive stationery */
.grid .item{position:relative;isolation:isolate;padding-top:46px!important}
.grid .item::before{content:"";position:absolute;inset:30px 7px 12px;background:#fffaf6;border:1.5px solid #f1c7ca;box-shadow:10px -13px 0 #e5f5fc,12px -14px 0 1px #d4bbd5;z-index:-1;transform:rotate(1.3deg)}
.grid .item::after{content:"";position:absolute;top:22px;left:37%;width:90px;height:24px;border:0;background:repeating-linear-gradient(90deg,#f7bcb0 0 14px,#fff9f4 14px 24px,#aadcf2 24px 37px);clip-path:polygon(0 0,100% 0,97% 50%,100% 100%,0 100%,3% 50%);transform:rotate(-8deg);opacity:.95;z-index:5;pointer-events:none}
.grid .item:nth-child(3n+2)::after{background:repeating-linear-gradient(90deg,#aadcf2 0 13px,#fff9f4 13px 23px)}
.grid .item:nth-child(3n+3)::after{background:repeating-linear-gradient(90deg,#f6d08a 0 13px,#fff9f4 13px 23px)}
.grid .item .photo{position:relative;overflow:visible;border:8px solid #fff;background:linear-gradient(135deg,#e5f5fc,#fff9f4);box-shadow:0 6px 18px #493c5020}
.grid .item .photo::after{content:"";position:absolute;top:-33px;left:-18px;width:35px;height:57px;border:5px solid #a4a3c9;border-radius:20px;transform:rotate(-32deg);box-shadow:inset 0 0 0 4px #fff9f4,0 3px 4px #493c5022;pointer-events:none}
.grid .item:nth-child(3n+2) .photo::after{border-color:#d58fa6;transform:rotate(24deg);left:auto;right:-16px}
.grid .item:nth-child(3n+3) .photo::after{border-color:#7ca8af;transform:rotate(-18deg)}
.grid .item .name{position:relative;display:block;background:#f7bcb0;color:#493c50;padding:10px 12px;margin:12px 0 0;text-align:center;box-shadow:3px 4px 0 #f0d4d2}
.grid .item .meta{position:relative;text-align:center;margin:8px 0 0}
.grid .item:hover,.grid .item:focus-visible{transform:translateY(-8px) rotate(0deg)}
@media(max-width:540px){.grid .item{max-width:360px;width:100%;margin:auto}}
@media(prefers-reduced-motion:reduce){.grid .item{transition:none!important}}
</style></head><body><main style="position:relative"><div class="scrapbook-stickers" aria-hidden="true"><img src="assets/stickers/flower-paperclip.png" alt="" onerror="this.hidden=true"><img src="assets/stickers/stationery-clips.png" alt="" onerror="this.hidden=true"><img src="assets/stickers/kraft-notebook.png" alt="" onerror="this.hidden=true"><img src="assets/stickers/stacked-books.png" alt="" onerror="this.hidden=true"><img src="assets/stickers/open-journal.png" alt="" onerror="this.hidden=true"></div><header><span class="journal-tape" aria-hidden="true"></span><div>✿ PROJECT COLLECTION</div><h1 id="title">Projects</h1><p id="intro">Explore the projects in this collection, then open a creative notebook case study.</p></header><div id="grid" class="grid"></div><p id="note" class="note"></p><nav class="collection-bottom"><a data-go-back href="works.html">← Go Back</a></nav></main>
<script>
const slug=s=>String(s||"").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
(async()=>{try{const r=await fetch("content/portfolio.json",{cache:"no-store"});if(!r.ok)throw Error("Data unavailable");const data=await r.json(),all=(data.projects||[]).filter(p=>p.published===true),selected=all.find(p=>slug(p.title)===new URLSearchParams(location.search).get("project"));if(!selected){document.getElementById("title").textContent="Collection not found";return;}document.title=selected.title+" — Collection";document.getElementById("title").textContent=selected.title;const same=all.filter(p=>p.category===selected.category);const items=Array.isArray(selected.subprojects)&&selected.subprojects.length?selected.subprojects.filter(p=>p.published!==false):same;document.getElementById("intro").textContent="Browse "+(selected.category||"design")+" projects, then open a project to see the full design process and final work.";document.getElementById("grid").innerHTML=items.map(p=>{const isSub=items!==same;const href=isSub?"project-story.html?project="+encodeURIComponent(slug(selected.title))+"&subproject="+encodeURIComponent(slug(p.title)):"project-story.html?project="+encodeURIComponent(slug(p.title));return '<a class="item" href="'+href+'"><div class="photo">'+(p.image?'<img loading="lazy" src="'+esc(p.image)+'" alt="'+esc(p.title)+' artwork">':'<span class="empty">✿</span>')+'</div><span class="name">'+esc(p.title)+'</span><p class="meta">'+esc(p.year||selected.year||"")+'</p></a>'}).join("");if(items.length===1)document.getElementById("note").textContent="More projects can be added to this collection later."; }catch(e){document.getElementById("title").textContent="Collection unavailable";}})();
</script><script>
(function(){const fallback="works.html";function sameSitePrevious(){try{const u=new URL(document.referrer);return u.origin===location.origin&&u.pathname!==location.pathname?u.href:null}catch{return null}}
const previous=sameSitePrevious();document.querySelectorAll("[data-go-back]").forEach(a=>{a.href=previous||fallback;a.addEventListener("click",e=>{if(previous&&history.length>1){e.preventDefault();history.back()}})});
})();
</script></body></html>
